services:
  backend:
    build:
      context: ./backend
    container_name: idmize-website-backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5001:5001"
    networks:
      - idmize-website-net

  frontend:
    build:
      context: .
      args:
        - NEXT_PUBLIC_API_URL=https://api.idmize.com
    container_name: idmize-website-frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.idmize.com
    depends_on:
      - backend
    networks:
      - idmize-website-net

networks:
  idmize-website-net:
    driver: bridge